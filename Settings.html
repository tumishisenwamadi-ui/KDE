<!DOCTYPE html>
<html lang="en"><head><title>Settings</title>  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="kpi.js"></script>
</head>
<body><main class="module-page">
  <div class="module-head"><a href="index.html" class="btn btn-secondary"><span class="material-symbols-rounded">arrow_back</span><span>Back to dashboard</span></a><h1>Settings</h1></div>
  <div class="chart-card"><div class="chart-card-header"><h3 class="chart-card-title">Appearance</h3></div>
    <div class="theme-toggle"><div class="theme-option" data-theme="light">Light</div><div class="theme-option" data-theme="dark">Dark</div></div></div>
</main>
<script>
  const cur = localStorage.getItem('dashboard-theme') || 'light';
  document.querySelectorAll('.theme-option').forEach(o => {
    o.classList.toggle('active', o.dataset.theme === cur);
    o.onclick = () => { localStorage.setItem('dashboard-theme', o.dataset.theme); document.documentElement.setAttribute('data-theme', o.dataset.theme);
      document.querySelectorAll('.theme-option').forEach(x => x.classList.toggle('active', x === o)); };
  });
</script></body></html>
